name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # The Store invokes vici directly after npm ci, without npm prebuild.
      - run: npx --no-install vici build --out dist
      - run: node scripts/check-build.mjs dist
      - run: node scripts/check-setup-ui.mjs dist
